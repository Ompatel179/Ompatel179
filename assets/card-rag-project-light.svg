<title id="t">RAG project (in progress)</title>
<desc id="d">A retrieval-augmented generation system: LLM answers grounded in real documents, with retrieval quality I can measure. coming soon · building in public. Built with Python, LLMs, Embeddings, Vector search.</desc>
