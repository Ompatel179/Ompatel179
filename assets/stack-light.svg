<desc id="d">Built with: ML / AI: PyTorch, TensorFlow, Keras, OpenCV, LLM APIs; Backend: Python, FastAPI, Flask, PostgreSQL, Redis, SQLAlchemy; Full stack: TypeScript, Next.js, Prisma, JavaScript, HTML/CSS; Ship it: Docker, GitHub Actions, Vercel, AWS S3, Locust. Currently learning: Kubernetes, RAG &amp; vector search, React, deeper, AWS beyond S3.</desc>
