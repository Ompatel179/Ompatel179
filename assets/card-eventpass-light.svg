<svg xmlns="http://www.w3.org/2000/svg" width="400" height="230" viewBox="0 0 400 230" role="img" aria-labelledby="t d">
<title id="t">EventPass (shipped)</title>
<desc id="d">QR-code check-in for student clubs. Every ticket scans exactly once, even when several organizers scan at the same moment. ~950 req/s · 0 duplicate check-ins · 97% coverage. Built with FastAPI, PostgreSQL, Redis, Docker, Actions.</desc>
