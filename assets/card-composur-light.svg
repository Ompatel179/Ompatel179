<svg xmlns="http://www.w3.org/2000/svg" width="400" height="230" viewBox="0 0 400 230" role="img" aria-labelledby="t d">
<title id="t">Composur (live)</title>
<desc id="d">Voice mock interviews where an LLM interviewer asks adaptive follow-ups across 28 interview domains. speech → streaming LLM → text-to-speech. Built with Next.js, TypeScript, PostgreSQL, Llama 3.3, AWS S3.</desc>
<style>
.blob{animation:breathe 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<clipPath id="c"><rect x="1" y="1" width="398" height="228" rx="16"/></clipPath>
<g clip-path="url(#c)">
  <rect x="1" y="1" width="398" height="228" fill="#FFFAF2"/>
  <circle class="blob" cx="382" cy="224" r="62" fill="#7B3F8C" opacity="0.13"/>
  <rect x="1" y="1" width="6" height="228" fill="#7B3F8C"/>
</g>
<rect x="1" y="1" width="398" height="228" rx="16" fill="none" stroke="#EADFCC" stroke-width="1.5"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect x="24" y="24" width="52.4" height="22" rx="11" fill="#7B3F8C" fill-opacity="0.14"/>
  <circle class="pulse" cx="36" cy="35" r="4" fill="#7B3F8C"/>
  <text x="45" y="39.5" font-size="12" font-weight="700" fill="#7B3F8C">live</text>
  <text x="376" y="40" text-anchor="end" font-size="11.5" fill="#6B6274">with @RishiiShah</text>
  <text x="24" y="76" font-size="22" font-weight="800" fill="#2A2433" letter-spacing="-0.3">Composur</text>
  <text x="24" y="102" font-size="13.5" fill="#6B6274"><tspan x="24" dy="0">Voice mock interviews where an LLM interviewer</tspan><tspan x="24" dy="19.5">asks adaptive follow-ups across 28 interview</tspan><tspan x="24" dy="19.5">domains.</tspan></text>
  <text x="24" y="166.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#7B3F8C">speech → streaming LLM → text-to-speech</text>
  <rect x="24.0" y="182" width="59.1" height="24" rx="12" fill="#F6EEDF" stroke="#EADFCC"/><text x="53.5" y="198" text-anchor="middle" font-size="12" fill="#2A2433">Next.js</text><rect x="89.1" y="182" width="82.4" height="24" rx="12" fill="#F6EEDF" stroke="#EADFCC"/><text x="130.3" y="198" text-anchor="middle" font-size="12" fill="#2A2433">TypeScript</text><rect x="177.5" y="182" width="89.1" height="24" rx="12" fill="#F6EEDF" stroke="#EADFCC"/><text x="222.0" y="198" text-anchor="middle" font-size="12" fill="#2A2433">PostgreSQL</text><rect x="272.6" y="182" width="76.2" height="24" rx="12" fill="#F6EEDF" stroke="#EADFCC"/><text x="310.7" y="198" text-anchor="middle" font-size="12" fill="#2A2433">Llama 3.3</text>
</g>
</svg>
